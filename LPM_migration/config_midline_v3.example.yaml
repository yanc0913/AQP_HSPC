# config_midline_v3.example.yaml
# Copy to config_midline_v3.yaml and edit the two paths under `project`.
# The real config is git-ignored, so machine paths are never committed.
# config_midline_v3.yaml
# Same as config.yaml but writes to results_midline_v3/, so results/ -
# which holds the first-submission figures - is left untouched.
# Segmentation is NOT re-run: run_midline_v3.py points
# track_from_labels.py at the existing labels under results/.
project:
  data_root: "/path/to/Analysis/data"
  results_root: "/path/to/Analysis/results"

dataset:
  groups:
    WT:
      input_dir: "wildtype_posterior"
      glob: "*.tif"
    MUT:
      input_dir: "aqp1a1_mutant_posterior"
      glob: "*.tif"

segmentation:
  model: "2D_versatile_fluo"
  time_axis: 0
  prob_thresh: 0.4
  nms_thresh: 0.2
  labels_suffix: "_labels.tif"

roi:
  enable: true
  early_frac: 0.3
  min_spots: 20
  x_expand_frac: 0.15
  y_expand_frac: 0.2
  y_pad_um: 10.0
  x_pad_um: 0.0

# ---------- Midline ----------
midline_tls:
  enable: true
  band_half_width_um: 20.0        # +-20 um removes 10.4% of nucleus-sized
                                  # objects; the old estimator removed 22.1%
                                  # from the wrong place. Deliberate: the
                                  # midline is populated by converging LPM
                                  # cells, so a wider band eats the very
                                  # population the experiment measures.

  # "bilateral" (default): midline = the GAP between the two bilateral nuclear
  #   bands, measured from nucleus-sized objects only, tilt from a rotation
  #   sweep. See _midline_v3_check/READ_ME.txt.
  # "mode_tls" (legacy): x-histogram MODE of ALL objects + y-binned TLS. That
  #   lands ON a band and flips side between movies; kept only for provenance.
  method: "bilateral"

  # --- bilateral estimator
  allow_tilt: true
  tilt_sweep_max_deg: 25.0        # sweep range either side of vertical
  tilt_sweep_step_deg: 0.5
  min_band_sep_um: 60.0           # two peaks closer than this are not 2 bands
  max_recenter_um: 60.0           # re-centring in the rotated frame is capped
  gap_frac: 0.30                  # gap = run below this fraction of band peak
  min_nuclei: 50
  fit_early_frac: 0.33

  # --- legacy "mode_tls" only; ignored when method: bilateral
  min_points: 60
  preband_half_width_um: 60.0
  x_center_mode_bins: 64
  y_mid_q0: 0.20
  y_mid_q1: 0.80
  fit_y_bins: 25
  fit_min_bin_points: 15
  max_abs_tilt_deg: 45.0          # legacy force-vertical fuse, NOT the sweep


tracking:
  px_um: 0.325
  dt_min: 10.0

  min_area_um2: 20.0
  max_area_um2: 60.0
  fragment_area_um2: 10.0

  search_range_um: 8.5
  memory: 2
  min_track_len: 3

  adaptive_stop_um: 5.0
  adaptive_step: 0.95

  max_spots_per_frame: 150
  min_separation_um: 3.0

# Gap closing (if you use it in your pipeline; safe to keep)
gap_closing:
  enable: true
  max_gap_frames: 3
  max_disp_um: 10.0
  w_dist: 1.0
  w_area: 2.0
  w_align: 4.0
  w_ecc: 0.5
  cost_max: 18.0

# ---------- Burst detection (aligned names) ----------
burst_detection:
  enable: true

  # Two-mode burst detection switches (names aligned across scripts)
  detect_track_break: true
  detect_within_track: true

  lookahead_frames: 2
  search_radius_um: 8.0

  # "big nucleus" threshold (candidate must have area_prev >= this)
  big_area_um2: 30.0

  # drop: area_now < area_prev * area_drop_ratio
  area_drop_ratio: 0.60

  # fragments: fragment area <= area_prev * frag_area_ratio_max
  # must be < 0.5 to avoid division; use 0.30 by default
  frag_area_ratio_max: 0.30

  min_frags: 2
  max_frags: 8

# ---------- Compare ----------
compare:
  enable: true
  start_hpf: 13.0
  end_hpf: 17.0
  dt_min: 10.0
  speed_skip_first_frame: true

  # width metric from x-quantiles
  width_q_low: 0.10
  width_q_high: 0.90

  # enforce WT-left MUT-right in boxplots
  group_order: ["WT", "MUT"]

  preburst_n_pre_frames: 3        # dt = -3,-2,-1
  preburst_agg: "mean"            # "mean" or "median"
  preburst_show_individual_movies: true

